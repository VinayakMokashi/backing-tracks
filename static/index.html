<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Shifter</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <header>
    <h1>Key Shifter 🎚️</h1>
    <p class="muted">Paste a YouTube or Instagram link → karaoke backing track,
      vocals removed, in your key and at your speed.</p>
  </header>

  <!-- 1. Link -->
  <section class="card">
    <label for="url">YouTube or Instagram link</label>
    <div class="row">
      <input id="url" type="text" spellcheck="false"
             placeholder="https://www.youtube.com/watch?v=…  or  https://www.instagram.com/reel/…">
      <button id="analyze">Analyze</button>
    </div>
    <label class="chk" style="margin-top:.6rem">
      <input type="checkbox" id="remove-vocals" checked>
      Remove vocals (uncheck if it's already an instrumental/karaoke track)
    </label>
    <p id="status" class="muted"></p>
  </section>

  <!-- 2. Key + target -->
  <section id="keys" class="card hidden">
    <h2 id="track-title"></h2>
    <p class="muted">Detected key:
      <b id="detected-key"></b> <span id="detected-conf" class="badge"></span>
      <span id="detected-bpm"></span></p>
    <div class="grid">
      <label>Sing it in
        <select id="target"></select>
      </label>
      <label>Shift
        <div class="stepper"><span id="shift-readout">—</span></div>
      </label>
      <label>Speed <span id="speed-readout" class="muted"></span>
        <input id="tempo" type="range" min="50" max="150" step="1" value="100">
      </label>
    </div>
    <div class="row">
      <button id="make" class="primary">Create my track</button>
      <span id="make-status" class="muted"></span>
    </div>
  </section>

  <!-- 3. Result -->
  <section id="result" class="card hidden">
    <p id="result-meta" class="muted"></p>
    <audio id="player" controls></audio>
    <p class="downloads"><a id="dl" download>Download MP3</a></p>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
